name: DemichevVoice
options:
  deploymentTarget:
    macOS: '14.0'
  developmentLanguage: ru
settings:
  base:
    SWIFT_VERSION: '6.0'
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: '-'
    DEVELOPMENT_TEAM: ''
    ENABLE_HARDENED_RUNTIME: YES
packages:
  WhisperKit:
    url: https://github.com/argmaxinc/argmax-oss-swift
    exactVersion: 1.1.0
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.15.7
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 3.1.0
targets:
  DemichevVoice:
    type: application
    platform: macOS
    productName: Demichev Voice
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Demichev Voice
        PRODUCT_MODULE_NAME: DemichevVoice
        EXECUTABLE_NAME: DemichevVoice
        PRODUCT_BUNDLE_IDENTIFIER: ru.demichev.voice
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Demichev Voice
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Demichev Voice использует микрофон для локальной диктовки на вашем Mac.
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        MARKETING_VERSION: 1.0.1
        CURRENT_PROJECT_VERSION: 2
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App.entitlements
    dependencies:
      - package: WhisperKit
        product: WhisperKit
      - package: FluidAudio
      - package: KeyboardShortcuts
  DemichevVoiceTests:
    type: bundle.unit-test
    platform: macOS
    sources: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.demichev.voice.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: '$(BUILT_PRODUCTS_DIR)/Demichev Voice.app/Contents/MacOS/DemichevVoice'
    dependencies:
      - target: DemichevVoice
schemes:
  DemichevVoice:
    build:
      targets:
        DemichevVoice: all
    test:
      targets: [DemichevVoiceTests]
